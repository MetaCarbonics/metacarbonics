<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MetaCarbonics</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                'primary-dark': '#0b3d2e',
                'primary-mid': '#0f5f44',
                'bg-offwhite': '#f6f8f6',
                'text-muted': '#6b7a73',
            }
        }
    }
}
</script>

<style>
body {
    font-family: 'Inter', sans-serif;
    background-color: #f6f8f6;
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center">

<div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">

    <h2 class="text-3xl font-bold text-center mb-6 text-primary-dark">
        MetaCarbonics
    </h2>

    <form id="authForm" class="space-y-4">

        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="email"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-mid"
                required>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="password"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-mid"
                required>
        </div>

        <p id="errorMsg" class="text-red-500 text-sm hidden"></p>

        <button type="submit" id="authBtn"
            class="w-full bg-primary-dark text-white py-2 rounded-lg hover:bg-primary-mid transition">
            Login
        </button>

        <button type="button" id="forgotPassword"
            class="w-full text-sm text-primary-dark hover:underline">
            Forgot password?
        </button>

        <p class="text-center text-sm mt-4">
            <span>Don't have an account?</span>
            <button type="button" id="signupRedirect" class="text-primary-dark font-semibold ml-1">
                Sign up
            </button>
        </p>

    </form>

    <details class="mt-6 border-t pt-4 text-sm">
      <summary class="cursor-pointer font-semibold text-primary-dark">Pilot test accounts</summary>
      <p class="text-xs text-text-muted mt-2">Choose a role. These browser-only pilot passwords will be replaced by the production identity database.</p>
      <select id="demoAccount" class="w-full border border-gray-300 rounded-lg px-3 py-2 mt-2">
        <option value="">Select a role…</option><option value="admin">Administrator</option><option value="bd">BD Manager</option><option value="projectlead">Project Lead</option><option value="manager">Project Manager</option><option value="developer">Project Developer</option><option value="operations">Operations</option><option value="finance">Finance</option><option value="ceo">CEO</option><option value="farmer">Farmer</option><option value="buyer">Buyer</option><option value="investor">Investor</option>
      </select>
    </details>

</div>

<script>
const form = document.getElementById("authForm");
const errorMsg = document.getElementById("errorMsg");
const forgotPasswordBtn = document.getElementById("forgotPassword");
const signupRedirectBtn = document.getElementById("signupRedirect");

function safeNextPage(next) {
    if (!next) return "index.html";
    if (/^[a-zA-Z0-9._-]+\.html$/.test(next)) return next;
    if (/^\/[a-zA-Z0-9._/-]+(?:\?[a-zA-Z0-9._%=&-]+)?$/.test(next) && !next.startsWith("//")) return next;
    return "index.html";
}

forgotPasswordBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
        errorMsg.textContent = "Enter your email first, then click Forgot password.";
        errorMsg.classList.remove("hidden");
        return;
    }

    try {
        await window.metaAuth.sendReset(email);
        errorMsg.classList.add("hidden");
    } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
    }
});

signupRedirectBtn.addEventListener("click", () => {
    window.location.href = "signup.html";
});
const demoCredentials={admin:['admin@metacarbonics.com','MetaAdmin#2026'],bd:['bd@metacarbonics.com','MetaBD#2026'],projectlead:['projectlead@metacarbonics.com','MetaLead#2026'],manager:['projectmanager@metacarbonics.com','MetaPM#2026'],developer:['projectdeveloper@metacarbonics.com','MetaDev#2026'],operations:['operations@metacarbonics.com','MetaOps#2026'],finance:['finance@metacarbonics.com','MetaFin#2026'],ceo:['ceo@metacarbonics.com','MetaCEO#2026'],farmer:['farmer.demo@metacarbonics.com','MetaFarmer#2026'],buyer:['buyer.demo@metacarbonics.com','MetaBuyer#2026'],investor:['investor.demo@metacarbonics.com','MetaInvestor#2026']};
document.getElementById('demoAccount').addEventListener('change',e=>{const c=demoCredentials[e.target.value];if(!c)return;document.getElementById('email').value=c[0];document.getElementById('password').value=c[1]});

// =====================
// 🚀 AUTH SUBMIT
// =====================
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    errorMsg.classList.add("hidden");
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next");
    const nextPage = safeNextPage(next);

    try {
        await window.metaAuth.login(email, password, nextPage);
    } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
    }
});

// =====================
// ✅ AUTO REDIRECT IF ALREADY LOGGED IN
// =====================
(async () => {
    const { data } = await window._supabase.auth.getSession();
    if (data.session) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");
        const nextPage = safeNextPage(next);
        window.location.href = nextPage;
    }
})();
</script>

<script src="global-auth-ui.js"></script>
</body>
</html>
