<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — MetaCarbonics</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                'primary-dark': '#0b3d2e',
                'primary-mid': '#0f5f44',
                'bg-offwhite': '#f6f8f6',
                'text-muted': '#6b7a73',
            }
        }
    }
}
</script>

<style>
body {
    font-family: 'Inter', sans-serif;
    background-color: #f6f8f6;
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center">

<div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">

    <h2 class="text-3xl font-bold text-center mb-6 text-primary-dark">
        MetaCarbonics
    </h2>

    <form id="authForm" class="space-y-4">

        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="email"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-mid"
                required>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="password"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-mid"
                required>
        </div>

        <p id="errorMsg" class="text-red-500 text-sm hidden"></p>

        <button type="submit" id="authBtn"
            class="w-full bg-primary-dark text-white py-2 rounded-lg hover:bg-primary-mid transition">
            Login
        </button>

        <button type="button" id="forgotPassword"
            class="w-full text-sm text-primary-dark hover:underline">
            Forgot password?
        </button>

        <p class="text-center text-sm mt-4">
            <span>Don't have an account?</span>
            <button type="button" id="signupRedirect" class="text-primary-dark font-semibold ml-1">
                Sign up
            </button>
        </p>

    </form>

</div>

<script>
const form = document.getElementById("authForm");
const errorMsg = document.getElementById("errorMsg");
const forgotPasswordBtn = document.getElementById("forgotPassword");
const signupRedirectBtn = document.getElementById("signupRedirect");

forgotPasswordBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) {
        errorMsg.textContent = "Enter your email first, then click Forgot password.";
        errorMsg.classList.remove("hidden");
        return;
    }

    try {
        await window.metaAuth.sendReset(email);
        errorMsg.classList.add("hidden");
    } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
    }
});

signupRedirectBtn.addEventListener("click", () => {
    window.location.href = "signup.html";
});

// =====================
// 🚀 AUTH SUBMIT
// =====================
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    errorMsg.classList.add("hidden");

    try {
        await window.metaAuth.login(email, password);
    } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
    }
});

// =====================
// ✅ AUTO REDIRECT IF ALREADY LOGGED IN
// =====================
(async () => {
    const { data } = await window._supabase.auth.getSession();
    if (data.session) {
        window.location.href = "index.html";
    }
})();
</script>

</body>
</html>
