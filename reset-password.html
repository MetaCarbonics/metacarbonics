<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
<h2 class="text-2xl font-bold mb-4">Reset Password</h2>

<input type="password" id="newPassword"
class="w-full border p-2 mb-4 rounded"
placeholder="New password">

<button id="updateBtn"
class="w-full bg-green-600 text-white py-2 rounded">
Update Password
</button>

<p id="msg" class="mt-3 text-sm text-red-500"></p>
</div>

<script>
document.getElementById("updateBtn").onclick = async () => {
const password = document.getElementById("newPassword").value;
const msg = document.getElementById("msg");

if (!password || password.length < 6) {
msg.innerText = "Password must be at least 6 characters.";
return;
}

const { data: sessionData } = await window._supabase.auth.getSession();
if (!sessionData.session) {
msg.innerText = "Reset link is invalid or expired. Please request a new one.";
return;
}

const { error } = await window._supabase.auth.updateUser({ password });

if(error){
msg.innerText = error.message;
}else{
alert("Password updated!");
window.location.href = "login.html";
}
};
</script>

</body>
</html>
