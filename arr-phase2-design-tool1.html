<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARR Phase 2 Design & Registration Tool — MetaCarbonics</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(to bottom, #f8faf7, #eef3ec);
  color: #2f3e2e;
}

header {
  padding: 20px 40px;
  background: white;
  border-bottom: 1px solid #e5e5e5;
  font-weight: bold;
}

.brand-accent { color: #3a7d44; }

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

.section-box {
  background: #f4f6f3;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  border: 1px solid #e0e5df;
}

label { display: block; margin: 10px 0; }

select { padding: 6px; margin-left: 10px; }

button {
  padding: 12px 20px;
  background: #3a7d44;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover { background: #2f6435; }

.result-box {
  margin-top: 30px;
  padding: 25px;
  border-radius: 10px;
  display: none;
}

.go { background: #e6f4ea; border: 1px solid #3a7d44; }
.conditional { background: #fff8e1; border: 1px solid #f4b400; }
.no-go { background: #fdecea; border: 1px solid #d93025; }

.score { font-size: 22px; font-weight: bold; }
</style>
</head>

<body>

<header>
MetaCarbonics — ARR Phase 2 Design & Registration Tool
</header>

<div class="container">

<h1>Design & Registration Assessment</h1>
<p>Select registry pathway before validation and submission.</p>

<form id="designForm">

<!-- REGISTRY SELECTION -->
<div class="section-box">
<h3>Registry Selection</h3>

<label>Registry Type:
<select id="registryType" onchange="populateRegistries()" required>
<option value="">Select Type</option>
<option value="voluntary">Voluntary Registries</option>
<option value="compliance">Compliance / ETS Registries</option>
<option value="regional">Regional / Emerging</option>
</select>
</label>

<label>Registry Name:
<select id="registryName" required>
<option value="">Select Registry</option>
</select>
</label>

</div>

<!-- TECHNICAL DESIGN -->
<div class="section-box">
<h3>Technical Design</h3>

<label>ARR methodology selected?
<select name="methodology">
<option value="2">Yes</option>
<option value="1">Under review</option>
<option value="0">No</option>
</select>
</label>

<label>Species selection completed?
<select name="species">
<option value="2">Yes</option>
<option value="1">Preliminary</option>
<option value="0">No</option>
</select>
</label>

<label>Carbon modeling completed?
<select name="modeling">
<option value="2">Complete</option>
<option value="1">Partial</option>
<option value="0">No</option>
</select>
</label>

<label>Leakage & permanence analysis done?
<select name="riskAnalysis">
<option value="2">Yes</option>
<option value="1">Draft</option>
<option value="0">No</option>
</select>
</label>
</div>

<!-- SAFEGUARDS -->
<div class="section-box">
<h3>Safeguards & Documentation</h3>

<label>Stakeholder consultation conducted?
<select name="stakeholder">
<option value="2">Yes</option>
<option value="1">Planned</option>
<option value="0">No</option>
</select>
</label>

<label>PDD prepared?
<select name="pdd">
<option value="2">Final</option>
<option value="1">Draft</option>
<option value="0">Not started</option>
</select>
</label>

<label>Validation body engaged?
<select name="validation">
<option value="2">Yes</option>
<option value="1">In discussion</option>
<option value="0">No</option>
</select>
</label>

<label>Registry submission ready?
<select name="registryReady">
<option value="2">Yes</option>
<option value="1">Nearly ready</option>
<option value="0">No</option>
</select>
</label>
</div>

<button type="button" onclick="calculateScore()">Evaluate Project</button>

</form>

<div id="result" class="result-box">
<div class="score" id="scoreText"></div>
<p id="decisionText"></p>
</div>

</div>

<script>

const registryData = {
voluntary: [
"Verra VCS","Gold Standard","ACR","CAR","ART/TREES","GCC",
"Cercarbono / EcoRegistry","Plan Vivo","Social Carbon",
"Puro.earth / C-Sink","BioCarbon Registry"
],
compliance: [
"CDM Registry (UNFCCC)","EU ETS","California Cap-and-Trade","RGGI",
"UK ETS","China National ETS","Korea ETS","NZ ETS",
"Tokyo & Saitama ETS","Swiss ETS","Mexico ETS",
"Kazakhstan ETS","Canadian ETS/OBPS","Washington Cap-and-Invest"
],
regional: [
"India CR-I","MESC Registry","UAE NRCC","Egypt Carbon Exchange",
"Saudi RVCMC","ADGM Carbon Registry","Bahrain Safa",
"Kuwait Carbon Offset Platform"
]
};

function populateRegistries() {
const type = document.getElementById("registryType").value;
const registrySelect = document.getElementById("registryName");
registrySelect.innerHTML = '<option value="">Select Registry</option>';

if (registryData[type]) {
registryData[type].forEach(reg => {
const option = document.createElement("option");
option.value = reg;
option.textContent = reg;
registrySelect.appendChild(option);
});
}
}

function calculateScore() {

const registryType = document.getElementById("registryType").value;
const registryName = document.getElementById("registryName").value;

if (!registryType || !registryName) {
alert("Please select registry type and registry name.");
return;
}

const form = document.getElementById("designForm");
let score = 0;

for (let element of form.elements) {
if (element.tagName === "SELECT" && element.name) {
score += parseInt(element.value);
}
}

const maxScore = 16;
const percentage = (score / maxScore) * 100;
const resultBox = document.getElementById("result");
const scoreText = document.getElementById("scoreText");
const decisionText = document.getElementById("decisionText");

resultBox.style.display = "block";

if (percentage >= 75) {
resultBox.className = "result-box go";
scoreText.innerText = "Score: " + score + " / 16 — GO";
decisionText.innerText = "Ready for validation under " + registryName + ".";
}
else if (percentage >= 50) {
resultBox.className = "result-box conditional";
scoreText.innerText = "Score: " + score + " / 16 — CONDITIONAL";
decisionText.innerText = "Strengthen documentation before submitting to " + registryName + ".";
}
else {
resultBox.className = "result-box no-go";
scoreText.innerText = "Score: " + score + " / 16 — NO-GO";
decisionText.innerText = "Major design gaps identified for " + registryName + ".";
}

window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

</script>

<script src="/global-auth-ui.js"></script>
</body>
</html>
