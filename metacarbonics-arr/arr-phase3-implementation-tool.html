<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARR Phase 3 Implementation Tool — MetaCarbonics</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(to bottom, #f8faf7, #eef3ec);
  color: #2f3e2e;
}

header {
  padding: 20px 40px;
  background: white;
  border-bottom: 1px solid #e5e5e5;
  font-weight: bold;
}

.brand-accent {
  color: #3a7d44;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  margin-bottom: 10px;
}

.section-box {
  background: #f4f6f3;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  border: 1px solid #e0e5df;
}

label {
  display: block;
  margin: 10px 0;
}

select {
  padding: 6px;
  margin-left: 10px;
}

button {
  padding: 12px 20px;
  background: #3a7d44;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #2f6435;
}

.result-box {
  margin-top: 30px;
  padding: 25px;
  border-radius: 10px;
  display: none;
}

.go { background: #e6f4ea; border: 1px solid #3a7d44; }
.conditional { background: #fff8e1; border: 1px solid #f4b400; }
.no-go { background: #fdecea; border: 1px solid #d93025; }

.score {
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  MetaCarbonics — ARR Phase 3 Implementation Tool
</header>

<div class="container">

<h1>Implementation & Restoration Assessment</h1>
<p>Evaluate operational readiness and on-ground execution progress.</p>

<form id="implementationForm">

<div class="section-box">
<h3>Site Preparation</h3>

<label>Nursery established and operational?
<select name="nursery">
<option value="2">Fully operational</option>
<option value="1">Partially ready</option>
<option value="0">Not established</option>
</select>
</label>

<label>Land preparation completed?
<select name="landPrep">
<option value="2">Completed</option>
<option value="1">Ongoing</option>
<option value="0">Not started</option>
</select>
</label>

<label>Species procured as per design?
<select name="speciesProcured">
<option value="2">Yes</option>
<option value="1">Partially</option>
<option value="0">No</option>
</select>
</label>

</div>

<div class="section-box">
<h3>Planting & Field Execution</h3>

<label>Planting completed as per plan?
<select name="planting">
<option value="2">Completed</option>
<option value="1">Ongoing</option>
<option value="0">Not started</option>
</select>
</label>

<label>Survival rate acceptable (>75%)?
<select name="survival">
<option value="2">Yes</option>
<option value="1">Moderate</option>
<option value="0">Low</option>
</select>
</label>

<label>Fire prevention measures implemented?
<select name="fire">
<option value="2">Yes</option>
<option value="1">Partially</option>
<option value="0">No</option>
</select>
</label>

<label>Grazing/pest control systems active?
<select name="pest">
<option value="2">Yes</option>
<option value="1">Limited</option>
<option value="0">No</option>
</select>
</label>

</div>

<div class="section-box">
<h3>Community & Governance</h3>

<label>Local community engagement active?
<select name="community">
<option value="2">Strong engagement</option>
<option value="1">Limited</option>
<option value="0">None</option>
</select>
</label>

<label>Monitoring data collection initiated?
<select name="dataCollection">
<option value="2">Yes</option>
<option value="1">Planned</option>
<option value="0">No</option>
</select>
</label>

</div>

<button type="button" onclick="calculateScore()">Evaluate Project</button>

</form>

<div id="result" class="result-box">
<div class="score" id="scoreText"></div>
<p id="decisionText"></p>
</div>

</div>

<script>
function calculateScore() {
  const form = document.getElementById("implementationForm");
  let score = 0;

  for (let element of form.elements) {
    if (element.tagName === "SELECT") {
      score += parseInt(element.value);
    }
  }

  const maxScore = 18;
  const percentage = (score / maxScore) * 100;
  const resultBox = document.getElementById("result");
  const scoreText = document.getElementById("scoreText");
  const decisionText = document.getElementById("decisionText");

  resultBox.style.display = "block";

  if (percentage >= 75) {
    resultBox.className = "result-box go";
    scoreText.innerText = "Score: " + score + " / 18 — GO";
    decisionText.innerText = "Implementation is on track. Proceed to Phase 4: Monitoring & Verification.";
  } else if (percentage >= 50) {
    resultBox.className = "result-box conditional";
    scoreText.innerText = "Score: " + score + " / 18 — CONDITIONAL";
    decisionText.innerText = "Operational gaps detected. Strengthen execution before scaling.";
  } else {
    resultBox.className = "result-box no-go";
    scoreText.innerText = "Score: " + score + " / 18 — NO-GO";
    decisionText.innerText = "Major implementation risks identified. Reassess field operations.";
  }

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
</script>

<script src="/global-auth-ui.js"></script>
</body>
</html>
