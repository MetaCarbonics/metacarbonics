<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARR Phase 4 MRV Tool — MetaCarbonics</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(to bottom, #f8faf7, #eef3ec);
  color: #2f3e2e;
}

header {
  padding: 20px 40px;
  background: white;
  border-bottom: 1px solid #e5e5e5;
  font-weight: bold;
}

.brand-accent {
  color: #3a7d44;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  margin-bottom: 10px;
}

.section-box {
  background: #f4f6f3;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  border: 1px solid #e0e5df;
}

label {
  display: block;
  margin: 10px 0;
}

select {
  padding: 6px;
  margin-left: 10px;
}

button {
  padding: 12px 20px;
  background: #3a7d44;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #2f6435;
}

.result-box {
  margin-top: 30px;
  padding: 25px;
  border-radius: 10px;
  display: none;
}

.go { background: #e6f4ea; border: 1px solid #3a7d44; }
.conditional { background: #fff8e1; border: 1px solid #f4b400; }
.no-go { background: #fdecea; border: 1px solid #d93025; }

.score {
  font-size: 22px;
  font-weight: bold;
}
</style>
  <script src="/cad-auth-gate.js"></script>
</head>

<body>

<header>
  MetaCarbonics — ARR Phase 4 MRV Tool
</header>

<div class="container">

<h1>Monitoring, Reporting & Verification Assessment</h1>
<p>Evaluate readiness for third-party verification and credit issuance.</p>

<form id="mrvForm">

<div class="section-box">
<h3>Monitoring System</h3>

<label>Permanent sample plots established?
<select name="plots">
<option value="2">Yes</option>
<option value="1">Partially</option>
<option value="0">No</option>
</select>
</label>

<label>Remote sensing monitoring active?
<select name="remote">
<option value="2">Yes</option>
<option value="1">Limited</option>
<option value="0">No</option>
</select>
</label>

<label>Data collection protocol documented?
<select name="protocol">
<option value="2">Fully documented</option>
<option value="1">Draft</option>
<option value="0">No</option>
</select>
</label>

</div>

<div class="section-box">
<h3>Carbon Accounting & Reporting</h3>

<label>Carbon stock calculation updated?
<select name="carbonCalc">
<option value="2">Updated</option>
<option value="1">Partial</option>
<option value="0">Not updated</option>
</select>
</label>

<label>Leakage & buffer pool calculation completed?
<select name="buffer">
<option value="2">Yes</option>
<option value="1">Under review</option>
<option value="0">No</option>
</select>
</label>

<label>Monitoring report prepared?
<select name="report">
<option value="2">Final</option>
<option value="1">Draft</option>
<option value="0">Not started</option>
</select>
</label>

</div>

<div class="section-box">
<h3>Verification Readiness</h3>

<label>Third-party verifier appointed?
<select name="verifier">
<option value="2">Yes</option>
<option value="1">In discussion</option>
<option value="0">No</option>
</select>
</label>

<label>Verification audit scheduled?
<select name="audit">
<option value="2">Scheduled</option>
<option value="1">Planned</option>
<option value="0">No</option>
</select>
</label>

<label>All documentation compiled for registry?
<select name="registryDocs">
<option value="2">Ready</option>
<option value="1">Nearly ready</option>
<option value="0">Incomplete</option>
</select>
</label>

</div>

<button type="button" onclick="calculateScore()">Evaluate Project</button>

</form>

<div id="result" class="result-box">
<div class="score" id="scoreText"></div>
<p id="decisionText"></p>
</div>

</div>

<script>
function calculateScore() {
  const form = document.getElementById("mrvForm");
  let score = 0;

  for (let element of form.elements) {
    if (element.tagName === "SELECT") {
      score += parseInt(element.value);
    }
  }

  const maxScore = 18;
  const percentage = (score / maxScore) * 100;
  const resultBox = document.getElementById("result");
  const scoreText = document.getElementById("scoreText");
  const decisionText = document.getElementById("decisionText");

  resultBox.style.display = "block";

  if (percentage >= 75) {
    resultBox.className = "result-box go";
    scoreText.innerText = "Score: " + score + " / 18 — GO";
    decisionText.innerText = "MRV system is robust. Proceed to Phase 5: Credit Issuance.";
  } else if (percentage >= 50) {
    resultBox.className = "result-box conditional";
    scoreText.innerText = "Score: " + score + " / 18 — CONDITIONAL";
    decisionText.innerText = "Strengthen reporting and verification documentation.";
  } else {
    resultBox.className = "result-box no-go";
    scoreText.innerText = "Score: " + score + " / 18 — NO-GO";
    decisionText.innerText = "Significant MRV gaps detected. Reassess monitoring framework.";
  }

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
</script>

<script src="/global-auth-ui.js"></script>
</body>
</html>
