<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ClimaVector — MetaCarbonics</title><link rel="stylesheet" href="styles.css"/></head>
<body>
  <header class="site-header"><div class="wrap header-inner"><div class="brand">MetaCarbonics</div><nav class="main-nav"><a href="index.html">Home</a><a href="#" id="logoutBtn">Logout</a></nav></div></header>

  <main>
    <section class="section">
      <div class="wrap" style="text-align:center;padding:80px 20px">
        <h1>ClimaVector</h1>
        <h2>Redirecting to ClimaVector…</h2>
        <p class="muted">This entry now routes directly to the Climavector app.</p>
        <p class="muted"><a id="climaLink" href="https://climavector-app-worker.metacarbonics.workers.dev/frontend/index.html">Open ClimaVector now</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="wrap">© 2026 MetaCarbonics. All Rights Reserved.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  const CLIMA_TARGET_URL = "https://climavector-app-worker.metacarbonics.workers.dev/frontend/index.html";
  const CLIMA_LOCAL_URL = "../Climavector/frontend/index.html";
  const link = document.getElementById("climaLink");
  const logoutBtn = document.getElementById("logoutBtn");
  link.href = CLIMA_TARGET_URL;

  async function init() {
    const { data } = await window._supabase.auth.getSession();
    const session = data?.session || null;

    if (!session) {
      const next = encodeURIComponent("climavector.html");
      window.location.href = `login.html?next=${next}`;
      return;
    }

    logoutBtn.addEventListener("click", async (event) => {
      event.preventDefault();
      await window._supabase.auth.signOut({ scope: "local" });
      window.location.href = "login.html";
    });

    try {
      window.location.replace(CLIMA_TARGET_URL);
    } catch (err) {
      window.location.replace(CLIMA_LOCAL_URL);
    }
  }

  init();
</script>
<script src="global-auth-ui.js"></script>
</body>
</html>
