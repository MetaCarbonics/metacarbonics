<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARR Phase 5 Credit Issuance Tool — MetaCarbonics</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(to bottom, #f8faf7, #eef3ec);
  color: #2f3e2e;
}

header {
  padding: 20px 40px;
  background: white;
  border-bottom: 1px solid #e5e5e5;
  font-weight: bold;
}

.brand-accent {
  color: #3a7d44;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  margin-bottom: 10px;
}

.section-box {
  background: #f4f6f3;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  border: 1px solid #e0e5df;
}

label {
  display: block;
  margin: 10px 0;
}

select {
  padding: 6px;
  margin-left: 10px;
}

button {
  padding: 12px 20px;
  background: #3a7d44;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #2f6435;
}

.result-box {
  margin-top: 30px;
  padding: 25px;
  border-radius: 10px;
  display: none;
}

.go { background: #e6f4ea; border: 1px solid #3a7d44; }
.conditional { background: #fff8e1; border: 1px solid #f4b400; }
.no-go { background: #fdecea; border: 1px solid #d93025; }

.score {
  font-size: 22px;
  font-weight: bold;
}
</style>
  <script src="/cad-auth-gate.js"></script>
</head>

<body>

<header>
  MetaCarbonics — ARR Phase 5 Credit Issuance Tool
</header>

<div class="container">

<h1>Credit Issuance & Commercialization Assessment</h1>
<p>Evaluate readiness for credit issuance, listing, and market transactions.</p>

<form id="creditForm">

<div class="section-box">
<h3>Credit Issuance</h3>

<label>Verification approval received?
<select name="verificationApproval">
<option value="2">Yes</option>
<option value="1">Pending</option>
<option value="0">No</option>
</select>
</label>

<label>Credits issued by registry?
<select name="issuance">
<option value="2">Issued</option>
<option value="1">In process</option>
<option value="0">Not issued</option>
</select>
</label>

<label>Buffer credits allocated correctly?
<select name="buffer">
<option value="2">Yes</option>
<option value="1">Under review</option>
<option value="0">No</option>
</select>
</label>

</div>

<div class="section-box">
<h3>Market Readiness</h3>

<label>Offtake agreements secured?
<select name="offtake">
<option value="2">Secured</option>
<option value="1">Negotiating</option>
<option value="0">No</option>
</select>
</label>

<label>Pricing strategy defined?
<select name="pricing">
<option value="2">Yes</option>
<option value="1">Preliminary</option>
<option value="0">No</option>
</select>
</label>

<label>Buyer due diligence completed?
<select name="buyerDD">
<option value="2">Completed</option>
<option value="1">Partial</option>
<option value="0">Not done</option>
</select>
</label>

</div>

<div class="section-box">
<h3>Revenue & Compliance</h3>

<label>Revenue distribution plan defined?
<select name="revenuePlan">
<option value="2">Yes</option>
<option value="1">Draft</option>
<option value="0">No</option>
</select>
</label>

<label>Community benefit-sharing active?
<select name="benefit">
<option value="2">Yes</option>
<option value="1">Planned</option>
<option value="0">No</option>
</select>
</label>

<label>Compliance & tax obligations addressed?
<select name="compliance">
<option value="2">Yes</option>
<option value="1">Under review</option>
<option value="0">No</option>
</select>
</label>

</div>

<button type="button" onclick="calculateScore()">Evaluate Project</button>

</form>

<div id="result" class="result-box">
<div class="score" id="scoreText"></div>
<p id="decisionText"></p>
</div>

</div>

<script>
function calculateScore() {
  const form = document.getElementById("creditForm");
  let score = 0;

  for (let element of form.elements) {
    if (element.tagName === "SELECT") {
      score += parseInt(element.value);
    }
  }

  const maxScore = 18;
  const percentage = (score / maxScore) * 100;
  const resultBox = document.getElementById("result");
  const scoreText = document.getElementById("scoreText");
  const decisionText = document.getElementById("decisionText");

  resultBox.style.display = "block";

  if (percentage >= 75) {
    resultBox.className = "result-box go";
    scoreText.innerText = "Score: " + score + " / 18 — GO";
    decisionText.innerText = "Credits ready for market. Project successfully commercialized.";
  } else if (percentage >= 50) {
    resultBox.className = "result-box conditional";
    scoreText.innerText = "Score: " + score + " / 18 — CONDITIONAL";
    decisionText.innerText = "Market strategy needs strengthening before scaling transactions.";
  } else {
    resultBox.className = "result-box no-go";
    scoreText.innerText = "Score: " + score + " / 18 — NO-GO";
    decisionText.innerText = "Commercial and compliance risks identified. Reassess issuance strategy.";
  }

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
</script>

<script src="/global-auth-ui.js"></script>
</body>
</html>
