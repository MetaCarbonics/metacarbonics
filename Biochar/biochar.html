<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting To Biochar</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        max-width: 520px;
      }
      a {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Opening Biochar Workflow</h1>
      <p id="statusText">Preparing redirect...</p>
      <p>
        <a
          id="fallbackLink"
          href="https://github.com/MetaCarbonics/Biochar/blob/main/index.html"
        >
          Go to Biochar index page
        </a>
      </p>
    </div>
    <script>
      // Hardcoded reference from MetaCarbonics biochar.html to Biochar repo index.html.
      const target = "https://github.com/MetaCarbonics/Biochar/blob/main/index.html";

      const statusText = document.getElementById("statusText");
      const fallbackLink = document.getElementById("fallbackLink");
      fallbackLink.href = target;

      statusText.textContent = `Redirecting to: ${target}`;
      window.location.href = target;
    </script>
  <script src="/global-auth-ui.js"></script>
</body>
</html>
