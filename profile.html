<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — MetaCarbonics</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background-color: #f6f8f6; }
</style>
</head>
<body class="min-h-screen">
<header class="bg-[#0b3d2e] text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="index.html" class="font-bold text-xl">MetaCarbonics</a>
        <button id="logoutBtn" class="bg-white text-[#0b3d2e] px-4 py-2 rounded-lg font-medium">Logout</button>
    </div>
</header>

<main class="max-w-5xl mx-auto p-4 md:p-8">
    <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
        <h1 class="text-3xl font-bold text-[#0b3d2e] mb-6">My Account</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div>
                <p class="text-sm text-gray-500">Name</p>
                <p id="nameValue" class="text-lg font-semibold">-</p>
            </div>
            <div>
                <p class="text-sm text-gray-500">Email</p>
                <p id="emailValue" class="text-lg font-semibold">-</p>
            </div>
            <div>
                <p class="text-sm text-gray-500">Role</p>
                <p id="roleValue" class="text-lg font-semibold">user</p>
            </div>
        </div>

        <div class="border-t pt-6">
            <h2 class="text-xl font-bold text-red-700 mb-2">Delete Account</h2>
            <p class="text-sm text-gray-600 mb-4">
                Submit a deletion request. After admin approval and account deletion, a deletion-success email can be sent from Supabase automation.
            </p>

            <label for="deleteReason" class="block text-sm font-medium mb-1">Reason (optional)</label>
            <textarea id="deleteReason" rows="4"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-red-600"
                placeholder="Tell us why you want to delete your account"></textarea>

            <p id="deleteMsg" class="text-sm mt-3 hidden"></p>

            <button id="requestDeleteBtn"
                class="mt-4 bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700 transition">
                Request Account Deletion
            </button>
        </div>
    </div>
</main>

<script>
const nameValue = document.getElementById("nameValue");
const emailValue = document.getElementById("emailValue");
const roleValue = document.getElementById("roleValue");
const deleteMsg = document.getElementById("deleteMsg");
const requestDeleteBtn = document.getElementById("requestDeleteBtn");
const logoutBtn = document.getElementById("logoutBtn");

(async () => {
    await window.metaAuth.protectPage();
    const current = await window.metaAuth.getCurrentUserWithProfile();
    if (!current || !current.user) {
        window.location.href = "login.html";
        return;
    }

    const name = current.profile?.full_name || current.user.user_metadata?.full_name || "User";
    nameValue.textContent = name;
    emailValue.textContent = current.user.email || "-";
    roleValue.textContent = current.profile?.role || "user";
})();

requestDeleteBtn.addEventListener("click", async () => {
    const confirmed = window.confirm("Do you want to request account deletion?");
    if (!confirmed) return;

    const reason = document.getElementById("deleteReason").value.trim();
    deleteMsg.classList.add("hidden");
    deleteMsg.classList.remove("text-red-600", "text-green-600");

    try {
        await window.metaAuth.requestAccountDeletion(reason);
        deleteMsg.textContent = "Deletion request submitted. You will receive an email after deletion is completed.";
        deleteMsg.classList.add("text-green-600");
        deleteMsg.classList.remove("hidden");
    } catch (error) {
        deleteMsg.textContent = error.message;
        deleteMsg.classList.add("text-red-600");
        deleteMsg.classList.remove("hidden");
    }
});

logoutBtn.addEventListener("click", async () => {
    await window.metaAuth.logout();
});
</script>
<script src="global-auth-ui.js"></script>
</body>
</html>
